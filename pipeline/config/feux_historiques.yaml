# Feux réels rejoués par le simulateur : python -I -m firesim_pipeline.rejeu <identifiant>
#
# nom_court : nom affiché sur le bouton du panneau, dans Unreal
# depart    : heure locale du départ, arrondie à l'heure (la météo est horaire)
# point     : latitude, longitude du départ, placé d'après la presse et le contour observé
# duree_h   : durée simulée ; le simulateur ne connaît pas encore la lutte, on s'arrête quand le feu a été contenu
# vegetation_vivante : scénario de sécheresse pour la végétation vivante (le bois mort suit la météo réelle)
# contour   : zone brûlée cartographiée par EFFIS (Copernicus) sur images satellite : année et identifiant
# observations : surfaces annoncées pendant le feu (heure locale : hectares)
# vegetation_apres_feu : la hauteur de la végétation (images de 2019) montre déjà la zone brûlée, rase : le feu est
#   rejoué, mais ne compte pas dans la calibration, qui y trouverait d'avance la réponse

olmeta-2017:
  nom: Olmeta-di-Tuda (Nebbio)
  nom_court: Olmeta-di-Tuda
  depart: "2017-07-24T10:00"
  point: [42.60834, 9.36602]
  duree_h: 24
  vegetation_vivante: extreme
  contour: {annee: 2017, id: 13531}
  vegetation_apres_feu: true
  observations:
    "2017-07-25T09:00": 1500
  notes: >-
    Parti « lundi matin » d'Olmeta-di-Tuda, heure exacte inconnue (10 h retenu) ; routes D62 et D82 coupées.
    Le feu a filé vers l'est sur un front de 4 km, jusqu'à Ficabruna et Furiani, pendant la nuit.
    1 500 ha le mardi matin, contenu le mardi après-midi, 1 800 ha au premier bilan du mercredi ;
    EFFIS cartographie 2 424 ha le 27 juillet. Météo : ERA5 seulement (avant les archives AROME).
  sources:
    - https://france3-regions.franceinfo.fr/corse/haute-corse/olmeta-di-tuda-feu-n-est-circonscrit-maitrise-1303027.html
    - https://www.sudradio.fr/faits-divers/haute-corse-200-soldats-du-feu-luttent-contre-lincendie-dolmeta-di-tuda
    - https://www.corsenetinfos.corsica/Biguglia-Le-territoire-de-la-commune-balaye-par-des-flammes-devastatrices_a28516.html

