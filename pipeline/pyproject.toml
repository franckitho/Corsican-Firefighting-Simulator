[project]
name = "firesim-pipeline"
version = "0.1.0"
description = "Préparation des données géographiques de la Corse pour le simulateur de feux de forêt"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "rasterio>=1.4",
  "geopandas>=1.0",
  "pyogrio>=0.10",
  "shapely>=2.0",
  "pyproj>=3.6",
  "py7zr>=0.22",
  "requests>=2.32",
  "pyyaml>=6.0",
  "matplotlib>=3.9",
  "boto3>=1.35",
]

[project.scripts]
firesim-pipeline = "firesim_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firesim_pipeline"]
